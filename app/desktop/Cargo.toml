[package]
name = "ultraclipboard-desktop"
version = "0.1.0"
edition = "2024"

# L'appli : processus Tauri qui héberge le moteur, le service D-Bus et la fenêtre.
[[bin]]
name = "ultraclipboard"
path = "src/main.rs"
doc = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
engine = { version = "0.1.0", path = "../engine" }
ultraclipboard = { version = "0.1.0", path = "../ultraclipboard" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
