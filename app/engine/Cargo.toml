[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "process", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
