[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "process", "macros", "io-util"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["test-util"] }
