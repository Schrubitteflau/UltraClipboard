[package]
name = "ultraclipboard"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { version = "0.1.0", path = "../engine" }
notify = "8"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "service"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
