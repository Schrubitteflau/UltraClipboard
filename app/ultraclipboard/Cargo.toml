[package]
name = "ultraclipboard"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { version = "0.1.0", path = "../engine" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "service"] }
